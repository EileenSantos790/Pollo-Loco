<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <link type="image/png" sizes="32x32" rel="icon" href="components/img_pollo_loco/img/icons8-sombrero-32.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <!-- Basis-Klassen -->
    <script src="./classes/drawableObject.class.js" defer></script>
    <script src="./classes/movableObject.class.js" defer></script>
    <script src="./classes/keyboard.class.js" defer></script>
    <script src="./classes/soundManager.class.js" defer></script>

    <!-- Alle Objekt-Klassen -->
    <script src="./classes/character.class.js" defer></script>
    <script src="./classes/chicken.class.js" defer></script>
    <script src="./classes/smallChicken.class.js" defer></script>
    <script src="./classes/endboss.class.js" defer></script>
    <script src="./classes/cloud.class.js" defer></script>
    <script src="./classes/backgroundObject.class.js" defer></script>
    <script src="./classes/collectableObject.class.js" defer></script>
    <script src="./classes/statusbar.class.js" defer></script>
    <script src="./classes/coinStatusbar.class.js" defer></script>
    <script src="./classes/bottleStatusbar.class.js" defer></script>
    <script src="./classes/endbossStatusbar.class.js" defer></script>
    <script src="./classes/throwableObject.class.js" defer></script>


    <!-- Level-Klassen -->
    <script src="./classes/level.class.js" defer></script>

    <!-- Level-Definitionen (nach level1!) -->
    <script src="./levels/level1.js" defer></script>

    <!-- World-Klasse (nach level1!) -->
    <script src="./classes/world.class.js" defer></script>

    <!-- Spiel-Logik -->
    <script src="./js/game.js" defer></script>

    <title>El Polo Loco</title>

</head>

<body class="stardos-stencil-regular" onload="init()">

    <div id="rotateDeviceOverlay" class="rotate-device-overlay">
        <div class="rotate-device-content">
            <img src="components/img_pollo_loco/img/smartphone-drehen.png" alt="Rotate Device"
                class="rotate-device-image">
        </div>
    </div>

    <div id="gameOverlay" class="game-overlay">
        <div class="overlay-content">
            <div class="flip-card" id="legalCard">
                <div class="flip-card-inner">
                    <div class="flip-card-front">
                        <span>Rechtliches</span>
                        <img src="components/img_pollo_loco/img/3_enemies_chicken/chicken_small/1_walk/2_w.png"
                            alt="Small Chicken" onclick="flipCard('legalCard')">
                    </div>
                    <div class="flip-card-back legal-board-container">
                        <div class="legal-board" onclick="flipCard('legalCard')">
                            <div class="legal-item">
                                <a href="./privacyPolicy.html" class="legal-link" target="_blank">Datenschutz</a>
                            </div>
                            <div class="legal-item">
                                <a href="./legalNotice.html" class="legal-link" target="_blank">Impressum</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="openGameSection">
                <h1 class="overlay-title">El Pollo Loco</h1>
                <p class="overlay-subtitle">Willkommen zum Spiel!</p>
                <button class="overlay-button" onclick="hideOverlay()">Zum Spiel</button>
            </div>

            <div class="flip-card" id="infoCard">
                <div class="flip-card-inner">
                    <div class="flip-card-front">
                        <span>Steuerung</span>
                        <img src="components/img_pollo_loco/img/6_salsa_bottle/salsa_bottle.png" alt="Salsa Bottle"
                            onclick="flipCard('infoCard')">
                    </div>
                    <div class="flip-card-back">
                        <div class="informationContainer" onclick="flipCard('infoCard')">
                            <div class="controls-board">
                                <div class="control-item">
                                    <div class="key-label">→</div>
                                    <span>Laufe Rechts</span>
                                </div>
                                <div class="control-item">
                                    <div class="key-label">←</div>
                                    <span>Laufe Links</span>
                                </div>
                                <div class="control-item">
                                    <div class="key-label">Space</div>
                                    <span>Springen</span>
                                </div>
                                <div class="control-item">
                                    <div class="key-label">↑</div>
                                    <span>Einsammeln</span>
                                </div>
                                <div class="control-item">
                                    <div class="key-label">D</div>
                                    <span>Werfen</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <section class="gameContainerPositioning">
        <div class="headline">
            <h1 translate="no">El Pollo Loco</h1>
        </div>
        <div class="gameSection" id="fullscreen">
            <div class="canvas-frame">
                <canvas id="gameCanvas" width="720" height="480"></canvas>
                <img id="fullscreenIcon" src="components/img_pollo_loco/img/fullscreen.png" alt="Fullscreen"
                    onclick="toggleFullscreen()">
                <img id="muteIcon" src="components/img_pollo_loco/img/icons8-sound-50.png" alt="Mute"
                    title="Sound ausschalten" onclick="toggleMute()">

                <!-- Mobile Controls innerhalb des Canvas -->
                <div class="mobile-controls" id="mobileControls">
                    <div class="control-row">
                        <button id="leftBtn" class="control-btn left-btn">
                            <span>←</span>
                        </button>
                        <button id="rightBtn" class="control-btn right-btn">
                            <span>→</span>
                        </button>
                        <button id="jumpBtn" class="control-btn jump-btn">
                            <span>↑</span>
                        </button>
                        <button id="throwBtn" class="control-btn throw-btn">
                            <span>↻</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </section>

</body>

</html>
